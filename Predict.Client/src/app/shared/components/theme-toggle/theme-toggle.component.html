    <button
      type="button"
      class="theme-toggle"
      [attr.aria-label]="'Theme: ' + themeService.theme() + '. Change theme'"
      [attr.title]="'Theme: ' + themeService.theme()"
      (click)="themeService.toggleTheme()"
    >
      <svg
        class="theme-toggle__icon"
        [class.theme-toggle__icon--dark]="themeService.theme() !== 'light'"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        @if (themeService.theme() === 'light') {
          <path d="M20.9 13A9 9 0 1 1 11 3.1 9 9 0 0 0 20.9 13Z" />
        } @else if (themeService.theme() === 'dark') {
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"
          />
        } @else {
          <path
            d="M12 3v18M3 12h18M5.64 5.64l12.72 12.72M18.36 5.64 5.64 18.36"
          />
        }
      </svg>
    </button>
