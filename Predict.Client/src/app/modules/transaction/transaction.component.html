<p-top-bar [hasUploadAction]="true" (uploadRequested)="openStorageSettings()">
  <ng-container module-navigation> </ng-container>
</p-top-bar>

<div class="p-2">
  <p-most-common-transaction
    [viewMode]="viewMode()"
    [transactions]="transactions()"
    [startDate]="startDate()"
    [endDate]="endDate()"
    [minDate]="minDate"
    [maxDate]="maxDate"
    (dateRangeChange)="handleRangeChange($event)"
    (viewModeChange)="onViewModeChange($event)"
  />
</div>
