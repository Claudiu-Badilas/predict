<p-top-bar [hasFiltersContent]="true" [hasModuleNavContent]="true">
  <ng-container module-navigation>
    <p-toggle-button-actions
      [options]="['Monthly', 'Yearly', 'All']"
      [selected]="getSelectedViewLabel()"
      (selectionChange)="onToggle($event)"
  /></ng-container>
  <button
    type="button"
    class="topbar-storage-button"
    topbar-actions
    aria-label="Transaction storage"
    title="Transaction storage"
    (click)="openStorageSettings()"
  >
    <img src="assets/icons/info.svg" alt="" aria-hidden="true" />
  </button>
  <ng-container filter-content>
    <div class="mb-2">
      <p-date-range-picker
        [startDate]="startDate()"
        [endDate]="endDate()"
        [minDate]="minDate"
        [maxDate]="maxDate"
        (valueChanged)="handleRangeChange($event)"
      />
    </div>

    <div class="mb-2">
      <p-dropdown-select
        [items]="providerDropDownSelectOptions()"
        [selectedItem]="selectedProvider()"
        placeholder="No Selection"
        (selectionChange)="onProviderDropdownSelected($event)"
      />
    </div>

    <div class="mb-2">
      <p-dropdown-select
        [items]="dropDownSelectOptions()"
        [selectedItem]="selectedServiceProvider()"
        placeholder="No Selection"
        (selectionChange)="onDropdownSelected($event)"
      />
    </div>

    <div class="mb-2">
      <p-search-input (search)="onSearch($event)" />
    </div>
  </ng-container>
</p-top-bar>

<router-outlet></router-outlet>
